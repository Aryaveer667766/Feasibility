$('#v-set').addEventListener('input',e=>{const t=e.target,x=t.dataset;if(x.sv){svc(x.sv)[x.f]=x.f=='rate'?+t.value:t.value}else if(x.up){DB.upi.find(u=>u.id==x.up)[x.f]=t.value.trim()}else if(x.g){setp(DB,x.g,t.type=='number'?+t.value:t.value)}else if(x.ua){DB.upiA=x.ua}save()});
$('#v-set').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset;
 if(b.id=='sb'){show('shop');rShop();return}
 if(x.xs){DB.services=DB.services.filter(s=>s.id!=x.xs);delete P.sel[x.xs]}else if(b.id=='as'){DB.services.push({id:'s'+Date.now(),name:'New service',rate:0,unit:'once'})}
 else if(x.xu){if(DB.upi.length>1){DB.upi=DB.upi.filter(u=>u.id!=x.xu);if(DB.upiA==x.xu)DB.upiA=DB.upi[0].id}}else if(b.id=='au'){DB.upi.push({id:'u'+Date.now(),vpa:'',label:'UPI'})}
 else if(x.tc){const c=DB.coupons.find(c=>c.id==x.tc);c.on=!c.on}else if(x.xc){DB.coupons=DB.coupons.filter(c=>c.id!=x.xc)}else if(x.ec||b.id=='ac'){cdlg(x.ec)}
 else if(b.id=='tgst'){DB.gst.on=!DB.gst.on}else if(b.id=='bk'){let dl=null;try{dl=await claude.use('downloads')}catch(er){}const bl=new Blob([JSON.stringify(DB)],{type:'application/json'});if(dl)await dl.save({filename:'pitch-desk-backup.json',data:bl});else toast('Backup is not available here');return}else return;
 save();setv()});
function cdlg(id){const c=id?DB.coupons.find(x=>x.id==id):{id:'c'+Date.now(),code:'',title:'',msg:'',type:'pct',value:10,cap:0,min:0,until:'',limit:0,apply:'all',on:true,free:DB.services[0]?.id},isNew=!id;
 $('#cdg').innerHTML=`<form id="cf"><h2 style="margin-top:0">${isNew?'New':'Edit'} coupon</h2><label>Code</label><input name="code" value="${esc(c.code)}" style="text-transform:uppercase" required><label>Offer title (shown in the burst)</label><input name="title" value="${esc(c.title)}"><label>Message</label><input name="msg" value="${esc(c.msg)}"><div class="r2"><div><label>Type</label><select name="type"><option value="pct"${c.type=='pct'?' selected':''}>Percent off</option><option value="flat"${c.type=='flat'?' selected':''}>Flat ₹ off</option><option value="free"${c.type=='free'?' selected':''}>Free service</option></select></div><div><label>Value</label><input name="value" type="number" inputmode="numeric" value="${c.value}"></div></div><div class="r2"><div><label>Free service</label><select name="free">${DB.services.map(s=>`<option value="${s.id}"${c.free==s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label>Max discount ₹ (percent)</label><input name="cap" type="number" inputmode="numeric" value="${c.cap||''}"></div></div><div class="r2"><div><label>Minimum order ₹</label><input name="min" type="number" inputmode="numeric" value="${c.min||''}"></div><div><label>Valid until</label><input name="until" type="date" value="${c.until||''}"></div></div><label>Usage limit (blank = unlimited)</label><input name="limit" type="number" inputmode="numeric" value="${c.limit||''}"><label>Applies to</label><div class="ap"><label><input type="checkbox" name="all" ${c.apply=='all'?'checked':''}> All services</label>${DB.services.map(s=>`<label><input type="checkbox" name="ap" value="${s.id}" ${c.apply!='all'&&c.apply.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</div><div class="md" style="margin-top:16px"><button type="button" id="cx">Cancel</button><button class="p" type="submit">Save</button></div></form>`;
 $('#cdg').showModal();$('#cx').onclick=()=>$('#cdg').close();
 $('#cf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),g=k=>f.get(k),code=String(g('code')).trim().toUpperCase();if(DB.coupons.some(x=>x.code==code&&x.id!=c.id)){toast('That code already exists');return}
  Object.assign(c,{code,title:g('title'),msg:g('msg'),type:g('type'),value:+g('value')||0,free:g('free'),cap:+g('cap')||0,min:+g('min')||0,until:g('until')||'',limit:+g('limit')||0,apply:f.get('all')?'all':f.getAll('ap')});if(c.apply!='all'&&!c.apply.length)c.apply='all';
  if(isNew)DB.coupons.push(c);save();$('#cdg').close();setv()}}

show('shop');rShop();

</script></body></html>

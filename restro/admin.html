<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin — Feasibility Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<style>
:root{--bg:#fff8ee;--card:#fff;--tx:#2b1810;--mut:#7a6558;--bd:#f0e0cc;--ac:#d62828;--ac2:#f77f00;--gold:#fcbf49;--ok:#2a9d5c;
--hf:"Fraunces",Georgia,serif;--bf:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b110c;--card:#261913;--tx:#fbeee0;--mut:#bda591;--bd:#3b2a20}}
:root[data-theme="dark"]{--bg:#1b110c;--card:#261913;--tx:#fbeee0;--mut:#bda591;--bd:#3b2a20}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--bf)}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.15}h2{font-size:1.3rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.d{background:#b3121b}button.gold{background:var(--gold);color:#2b1810}button.ok{background:var(--ok)}
input{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:5px 0}
label{font-size:.85rem;color:var(--mut);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.row>*{min-width:0}
.mut{color:var(--mut);font-size:.92rem}
.top{background:linear-gradient(150deg,#2b1810,#5a1f14 60%,#9c2b1a);color:#fff8ee;padding:16px 0;margin-bottom:8px}
.top h1{font-size:1.5rem}.top button.g{color:#fff;border-color:rgba(255,255,255,.45)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}.stat b{display:block;font:900 1.7rem var(--hf);color:var(--ac)}
.badge{padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--gold);color:#2b1810}
.rest{display:grid;gap:12px}
.rhead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.mini div{background:var(--bg);border-radius:12px;padding:8px 12px}.mini b{display:block;font-size:1.1rem}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:10px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mut)}
.chart i{display:block;width:100%;background:linear-gradient(var(--ac2),var(--ac));border-radius:8px 8px 0 0;min-height:3px}
.cred{background:#fff0cf;color:#2b1810;border:2px dashed #c98a0f;border-radius:16px;padding:14px;margin:12px 0}
.cred code{background:#fff;padding:2px 8px;border-radius:8px;font-weight:700}
.login{max-width:400px;margin:14vh auto;padding:0 16px}.login h1{font-size:2rem;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:700;padding:12px 22px;border-radius:99px;z-index:99}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toFixed(2);
firebase.initializeApp({apiKey:"AIzaSyAZ_c3EaDxSZ6RrNrwQjR_TauJHrPfk_lk",authDomain:"designsnap-f3309.firebaseapp.com",databaseURL:"https://designsnap-f3309-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"designsnap-f3309",storageBucket:"designsnap-f3309.firebasestorage.app",messagingSenderId:"741888249963",appId:"1:741888249963:web:9540c9f68d6f0d5da9a12e"});
const F=firebase.database(),arr=x=>x?Object.values(x).filter(Boolean):[];
let rests={},ref=null,q='',created=null;
const siteUrl=f=>new URL(f,location.href).href;

/* ---------- login ---------- */
function loginView(msg){$('#app').innerHTML=`<div class="login"><h1>🛡️ Admin</h1><p class="mut">Feasibility Media control panel</p><div class="card"><label>Password</label>
 <input id="ap" type="password" onkeydown="if(event.key==='Enter')login()">${msg?`<p style="color:#b3121b;margin:6px 0">${esc(msg)}</p>`:''}<button style="width:100%;margin-top:8px" onclick="login()">Log in</button></div></div>`}
async function getPw(){let pw=(await F.ref('admin').get()).val();
 if(pw===null){pw='admin123';await F.ref('admin').set(pw);await F.ref('restaurants/DEMO').set({name:'Demo Bistro',pin:'1234',color:'#d62828',tables:6,menu:[{id:1,name:'Margherita Pizza',price:9.5,cat:'Mains',desc:'Tomato, mozzarella, basil'},{id:2,name:'Fries',price:3.5,cat:'Sides',desc:''},{id:3,name:'Lemonade',price:2.5,cat:'Drinks',desc:''}],promos:[{code:'WELCOME10',pct:10}]})}
 return String(pw)}
async function login(){const p=$('#ap').value;if(!p)return;if(p!==await getPw()){loginView('Wrong password.');return}
 sessionStorage.setItem('fm_admin',p);start()}
function logout(){sessionStorage.removeItem('fm_admin');if(ref)ref.off();ref=null;loginView()}
async function boot(){const p=sessionStorage.getItem('fm_admin');if(p&&p===await getPw())start();else loginView()}

/* ---------- data ---------- */
function start(){$('#app').innerHTML='<p class="mut" style="padding:40px;text-align:center">Loading…</p>';
 ref=F.ref('restaurants');ref.on('value',s=>{const v=s.val()||{};rests={};
  Object.entries(v).forEach(([c,r])=>{r.orders=arr(r.orders).sort((a,b)=>a.id-b.id);r.menu=arr(r.menu);rests[c]=r});
  if(!/INPUT/.test(document.activeElement.tagName))render()})}
const sales=r=>r.orders.reduce((a,o)=>a+o.total,0);
const day0=()=>new Date().setHours(0,0,0,0);
const todayS=r=>r.orders.filter(o=>o.ts>=day0()).reduce((a,o)=>a+o.total,0);
function render(){const all=Object.entries(rests),orders=all.flatMap(([,r])=>r.orders),tot=orders.reduce((a,o)=>a+o.total,0),td=orders.filter(o=>o.ts>=day0());
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);const s=d.getTime(),e=s+864e5;return{l:d.toLocaleDateString([],{weekday:'short'}),v:orders.filter(o=>o.ts>=s&&o.ts<e).reduce((a,o)=>a+o.total,0)}}),mx=Math.max(1,...days.map(d=>d.v));
 const list=all.filter(([c,r])=>!q||(r.name+c).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>sales(b[1])-sales(a[1]));
 $('#app').innerHTML=`<div class="top"><div class="wrap row sp" style="padding-bottom:0"><div><h1>🛡️ Feasibility Media</h1><div style="opacity:.8;font-size:.9rem">Admin panel</div></div><div class="row"><button class="g" onclick="exportCsv()">⬇ Export CSV</button><button class="g" onclick="changePw()">Change password</button><button class="g" onclick="logout()">Log out</button></div></div></div>
 <div class="wrap">
 <div class="stats"><div class="stat"><span class="mut">Total sales</span><b>${money(tot)}</b></div><div class="stat"><span class="mut">Sales today</span><b>${money(td.reduce((a,o)=>a+o.total,0))}</b></div><div class="stat"><span class="mut">Total orders</span><b>${orders.length}</b></div><div class="stat"><span class="mut">Restaurants</span><b>${all.length}</b></div></div>
 <div class="card"><h2>Sales — last 7 days</h2><div class="chart">${days.map(d=>`<div><span>${d.v?money(d.v):''}</span><i style="height:${Math.max(3,d.v/mx*100)}%"></i><span>${d.l}</span></div>`).join('')}</div></div>
 <div class="card"><h2>Create restaurant page</h2><div class="row"><div style="flex:2;min-width:180px"><label>Restaurant name</label><input id="an" placeholder="e.g. Spice Garden"></div><div style="flex:1;min-width:110px"><label>PIN</label><input id="apn" placeholder="auto" inputmode="numeric"></div><div style="flex:1;min-width:110px"><label>Tables</label><input id="at" type="number" min="1" value="5"></div></div><button style="margin-top:8px" onclick="addRest()">＋ Create restaurant</button>
 ${created?`<div class="cred"><b>✅ ${esc(created.name)} is live!</b><br>Code: <code>${created.c}</code> &nbsp; PIN: <code>${esc(created.p)}</code><br><span class="mut" style="color:#2b1810">Dashboard: ${esc(siteUrl('restaurant.html'))}</span><div class="row" style="margin-top:8px"><button class="gold" onclick="copy(${JSON.stringify(`${created.name}\nDashboard: ${siteUrl('restaurant.html')}\nCode: ${created.c}\nPIN: ${created.p}`).replace(/"/g,'&quot;')})">Copy login details</button><button class="g" style="color:#2b1810" onclick="created=null;render()">Dismiss</button></div></div>`:''}</div>
 <div class="row sp" style="margin-top:20px"><h2>Restaurants</h2><input id="sq" placeholder="Search…" value="${esc(q)}" oninput="q=this.value;render();const i=$('#sq');i.focus();i.setSelectionRange(q.length,q.length)" style="max-width:240px"></div>
 <div class="rest">${list.map(([c,r])=>`<div class="card"><div class="rhead"><div><h3><span class="dot" style="background:${esc(r.color||'#d62828')}"></span>${esc(r.name)}</h3><div class="mut"><span class="badge">${esc(c)}</span> · PIN ${esc(r.pin)} · ${r.tables||1} tables · ${r.menu.length} menu items</div></div>
 <div class="row"><a href="${siteUrl('index.html')}?r=${esc(c)}" target="_blank" rel="noopener"><button class="g">Customer menu ↗</button></a><button class="g" onclick="resetPin('${esc(c)}')">Reset PIN</button><button class="d" onclick="delRest('${esc(c)}')">Delete</button></div></div>
 <div class="mini"><div><span class="mut">Orders</span><b>${r.orders.length}</b></div><div><span class="mut">Today</span><b>${money(todayS(r))}</b></div><div><span class="mut">Total sales</span><b>${money(sales(r))}</b></div></div></div>`).join('')||'<p class="mut">No restaurants found.</p>'}</div></div>`}

/* ---------- actions ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Copied ✅')).catch(()=>prompt('Copy this:',t))}
function addRest(){const n=$('#an').value.trim();if(!n){alert('Please enter the restaurant name.');return}
 const p=$('#apn').value.trim()||String(Math.floor(1000+Math.random()*9000)),t=Math.max(1,Math.min(200,parseInt($('#at').value)||5));
 let c;do{c=Math.random().toString(36).replace(/[^a-z0-9]/g,'').slice(0,5).toUpperCase()}while(c.length<5||rests[c]);
 F.ref('restaurants/'+c).set({name:n,pin:p,color:'#d62828',tables:t}).then(()=>{created={c,name:n,p};render()}).catch(()=>alert('Could not create. Check your connection and database rules.'))}
function resetPin(c){const p=prompt('New PIN for '+rests[c].name,String(Math.floor(1000+Math.random()*9000)));if(p&&p.trim())F.ref('restaurants/'+c+'/pin').set(p.trim()).then(()=>toast('PIN updated ✅'))}
function delRest(c){if(confirm('Delete “'+rests[c].name+'” and ALL its menu and orders? This cannot be undone.')&&prompt('Type the code '+c+' to confirm')===c)F.ref('restaurants/'+c).remove()}
async function changePw(){const p=prompt('New admin password (min 6 characters)');if(!p||p.length<6){if(p)alert('Too short.');return}await F.ref('admin').set(p);sessionStorage.setItem('fm_admin',p);toast('Password changed ✅')}
function exportCsv(){const rows=[['Restaurant','Code','Order #','Date','Table','Items','Promo','Total','Status']];
 Object.entries(rests).forEach(([c,r])=>r.orders.forEach(o=>rows.push([r.name,c,o.id,new Date(o.ts).toLocaleString(),o.table||'',o.items.map(i=>i.q+'x '+i.n).join('; '),o.promo||'',o.total.toFixed(2),o.status])));
 const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='feasibility-orders-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
boot();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d62828">
<title>Scan. Order. Enjoy. — Feasibility Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<style>
:root{--bg:#fff8ee;--card:#fff;--tx:#2b1810;--mut:#7a6558;--bd:#f0e0cc;--ac:#d62828;--ac2:#f77f00;--gold:#fcbf49;--ok:#2a9d5c;
--hf:"Fraunces",Georgia,serif;--bf:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b110c;--card:#261913;--tx:#fbeee0;--mut:#bda591;--bd:#3b2a20}}
:root[data-theme="dark"]{--bg:#1b110c;--card:#261913;--tx:#fbeee0;--mut:#bda591;--bd:#3b2a20}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--bf);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:#2b1810;font-weight:700;padding:16px 28px;border-radius:99px;font-size:1.1rem;box-shadow:0 8px 0 #c98a0f,0 14px 24px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #c98a0f,0 6px 12px rgba(0,0,0,.25)}
.btn.sm{padding:11px 20px;font-size:1rem;box-shadow:none;background:var(--ac);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.55)}
.btn.ghost:active{transform:none}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff8ee;background:radial-gradient(circle at 80% 10%,#ff9f1c 0,transparent 45%),linear-gradient(150deg,#b3121b,#d62828 55%,#f77f00);padding:28px 0 90px}
.nav{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.02em}
.logo{font-family:var(--hf);font-size:1.25rem}
.hero h1{font-size:clamp(2.6rem,9vw,5.2rem);font-weight:900;margin:48px 0 16px;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:1.15rem;max-width:30rem;opacity:.95;margin:0 0 30px}
.cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.float{position:absolute;font-size:clamp(3rem,9vw,6rem);opacity:.9;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3));animation:fl 6s ease-in-out infinite}
.f1{right:6%;top:18%}.f2{right:26%;bottom:8%;animation-delay:-2s;font-size:clamp(2.2rem,6vw,4rem)}.f3{right:2%;bottom:18%;animation-delay:-4s;font-size:clamp(2rem,5vw,3.5rem)}
@keyframes fl{50%{transform:translateY(-14px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}html{scroll-behavior:auto}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:50px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:-10px 0 40px}
.step{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(214,40,40,.08)}
.step .n{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-family:var(--hf);font-weight:900;font-size:1.3rem;margin-bottom:12px}
.step h3{font-size:1.3rem;margin-bottom:6px}.step p{margin:0;color:var(--mut)}
.band{background:linear-gradient(135deg,var(--gold),#f9a826);color:#2b1810;border-radius:26px;padding:34px 24px;text-align:center;margin-bottom:40px}
.band h2{font-size:clamp(1.6rem,5vw,2.4rem);margin-bottom:10px}.band p{margin:0 auto 20px;max-width:30rem}
.band .btn{background:#2b1810;color:#fff8ee;box-shadow:0 6px 0 #000}
footer{text-align:center;color:var(--mut);font-size:.9rem;padding:10px 0 40px}
/* menu */
.mh{background:linear-gradient(150deg,#b3121b,var(--ac) 60%,var(--ac2));color:#fff8ee;padding:22px 0 30px;border-radius:0 0 28px 28px}
.mh h1{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:900}
.tb{display:inline-block;background:var(--gold);color:#2b1810;font-weight:700;border-radius:99px;padding:4px 14px;font-size:.9rem;margin-top:10px}
.note{background:var(--gold);color:#2b1810;border-radius:16px;padding:12px 16px;margin:16px 0;font-weight:500}
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 18px;margin:0 -18px}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:8px 18px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sec{margin:22px 0 8px;font-size:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.item h3{font-size:1.15rem;font-family:var(--bf);font-weight:700}.item p{margin:2px 0 6px;color:var(--mut);font-size:.92rem}
.price{font-weight:700;color:var(--ac)}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;font-size:1.3rem;line-height:1}
.qty button.m{background:var(--bd);color:var(--tx)}
.soldout{background:var(--bd);color:var(--mut);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:700}
.thanks{background:linear-gradient(135deg,var(--gold),#f9a826);color:#2b1810;border:0}.thanks .btn.sm{background:#2b1810;color:#fff8ee}
.track{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.steps4{display:flex;gap:6px;margin-top:10px}.steps4 i{flex:1;height:7px;border-radius:9px;background:var(--bd)}.steps4 i.on{background:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.bar .in{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,8,4,.78);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,textarea{width:100%;padding:13px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
.x{background:var(--bd);color:var(--tx);width:38px;height:38px;border-radius:50%;font-size:1.1rem}
video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;background:#000;margin:14px 0}
.frame{position:relative}.frame:after{content:"";position:absolute;inset:18%;border:4px solid var(--gold);border-radius:22px;pointer-events:none}
.mut{color:var(--mut)}.center{text-align:center}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:700;padding:12px 22px;border-radius:99px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
</style></head><body>
<div id="app"></div>
<div id="scan" class="ov" hidden><div class="sheet">
 <div class="row"><h2>Scan the table QR</h2><button class="x" onclick="closeScan()" aria-label="Close">✕</button></div>
 <div class="frame"><video id="v" playsinline muted></video></div>
 <p id="sm" class="mut center" style="margin:0 0 12px">Point your camera at the QR code on your table.</p>
 <div class="row"><input id="cd" placeholder="Or type restaurant code" style="margin:0"><button class="btn sm" onclick="manual()">Go</button></div>
</div></div>
<div id="sheet" class="ov" hidden><div class="sheet" id="sb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toFixed(2);
const Q=new URLSearchParams(location.search),CODE=(Q.get('r')||'').trim().toUpperCase(),TABLE=(Q.get('t')||'').trim();
firebase.initializeApp({apiKey:"AIzaSyAZ_c3EaDxSZ6RrNrwQjR_TauJHrPfk_lk",authDomain:"designsnap-f3309.firebaseapp.com",databaseURL:"https://designsnap-f3309-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"designsnap-f3309",storageBucket:"designsnap-f3309.firebasestorage.app",messagingSenderId:"741888249963",appId:"1:741888249963:web:9540c9f68d6f0d5da9a12e"});
const F=firebase.database();
let R=null,loaded=false,cart={},promo=null,stream=null,scanning=false;
const arr=x=>x?Object.values(x).filter(Boolean):[];
const myKey='fm_my2_'+CODE,myList=()=>{try{return JSON.parse(localStorage.getItem(myKey)||'[]')}catch(e){return[]}},setMy=l=>{try{localStorage.setItem(myKey,JSON.stringify(l))}catch(e){}};
let swReg=null;if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
async function webNotify(title,body,tag){try{if(!('Notification' in window)||Notification.permission!=='granted')return;
 const r=swReg||await navigator.serviceWorker.getRegistration();
 if(r&&r.showNotification)await r.showNotification(title,{body,tag,vibrate:[200,100,200],data:{url:location.href}});else new Notification(title,{body,tag})}catch(e){}}
function enableNotify(){if('Notification' in window)Notification.requestPermission().then(()=>menu())}

/* ---------- HOME (no code): hero + CTA ---------- */
function home(){$('#app').innerHTML=`
<section class="hero"><div class="wrap">
 <div class="nav"><span class="logo">🍽️ Feasibility Menu</span><span>Table ordering</span></div>
 <h1>Hungry? <em>Scan.</em> Order. Enjoy.</h1>
 <p>No waiting for the menu. No waving at waiters. Scan the QR code on your table and your food is on its way.</p>
 <div class="cta"><button class="btn" onclick="openScan()">📷&nbsp; Scan QR to order</button><button class="btn ghost" onclick="openScan(true)">Enter code</button></div>
 <span class="float f1">🍕</span><span class="float f2">🍔</span><span class="float f3">🍜</span>
</div><div class="wave"></div></section>
<main class="wrap">
 <div class="steps">
  <div class="step"><div class="n">1</div><h3>Scan</h3><p>Point your phone camera at the QR code on your table.</p></div>
  <div class="step"><div class="n">2</div><h3>Pick</h3><p>Browse the live menu, add your favourites and use promo codes.</p></div>
  <div class="step"><div class="n">3</div><h3>Relax</h3><p>The kitchen gets your order instantly. Track it right on your phone.</p></div>
 </div>
 <div class="band"><h2>Ready when you are.</h2><p>Your table’s QR code is all you need. Nothing to download, nothing to sign up for.</p><button class="btn" onclick="openScan()">Scan &amp; order now</button></div>
 <footer>Powered by <b>Feasibility Media</b></footer>
</main>`;}

/* ---------- SCANNER ---------- */
function openScan(focusInput){$('#scan').hidden=false;if(focusInput){setTimeout(()=>$('#cd').focus(),50)}startCam()}
function closeScan(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#scan').hidden=true}
function manual(){const c=$('#cd').value.trim().toUpperCase();if(c)location.href='?r='+encodeURIComponent(c)}
async function startCam(){const sm=$('#sm');
 if(!navigator.mediaDevices||!('BarcodeDetector' in window)){sm.textContent='Live scanning isn’t supported here. Open your phone’s camera app on the table QR, or type the code below.';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#v');v.srcObject=stream;await v.play();
  const bd=new BarcodeDetector({formats:['qr_code']});scanning=true;
  const tick=async()=>{if(!scanning)return;try{const c=await bd.detect(v);if(c[0]){handle(c[0].rawValue);return}}catch(e){}setTimeout(tick,250)};tick();
 }catch(e){sm.textContent='Camera access was blocked. Type the restaurant code below instead.'}}
function handle(t){try{const u=new URL(t),r=u.searchParams.get('r');if(r){closeScan();location.href='?'+u.searchParams.toString();return}}catch(e){}
 if(/^[A-Za-z0-9]{3,12}$/.test(t)){location.href='?r='+t.toUpperCase();return}
 $('#sm').textContent='That QR code isn’t one of ours. Try your table’s code.';setTimeout(()=>{if(scanning)startCam()},0)}

/* ---------- MENU ---------- */
/* Customers read ONLY the public parts of a restaurant (never PINs or other people's orders) */
const KEYS=['name','color','menu','promos','notes'],parts={},got=new Set(),my={},watched={};
function build(){if(got.size<KEYS.length)return;R=parts.name==null?null:{name:parts.name,color:parts.color,menu:arr(parts.menu),promos:arr(parts.promos),notes:arr(parts.notes)};
 loaded=true;if(R&&R.color)document.documentElement.style.setProperty('--ac',R.color);menu();if(!$('#sheet').hidden)sheet()}
function noteNotify(){const ns=arr(parts.notes).sort((a,b)=>a.ts-b.ts);if(!ns.length)return;const top=ns[ns.length-1],key='fm_note_'+CODE,last=localStorage.getItem(key);
 if(last===null){localStorage.setItem(key,top.ts);return}if(top.ts>+last){localStorage.setItem(key,top.ts);webNotify(parts.name||'New offer',top.text,'note')}}
function statusNotify(o){const m={preparing:['Order accepted 👨‍🍳','The kitchen is preparing order #'+o.id],ready:['Your order is ready! 🎉','Order #'+o.id+' is ready'],served:['Enjoy your meal 😋','Thanks for ordering from '+(parts.name||'us')]}[o.status];if(m)webNotify(m[0],m[1],'o'+o.id)}
function dismissLocal(id){setMy(myList().filter(e=>e.id!==id));if(watched[id]){watched[id].off();delete watched[id]}delete my[id];if(R)menu()}
function watchOrder(id,initial){if(watched[id])return;let fs=true;watched[id]=F.ref('restaurants/'+CODE+'/orders/'+id);
 watched[id].on('value',s=>{const o=s.val();
  if(!o){dismissLocal(id);return}
  if(fs&&initial&&o.status==='served'){fs=false;dismissLocal(id);return}   // finished in an earlier visit: start fresh
  const prev=my[id]&&my[id].status;my[id]=o;if(!fs&&prev&&prev!==o.status)statusNotify(o);fs=false;if(R)menu()})}
if(CODE){KEYS.forEach(k=>F.ref('restaurants/'+CODE+'/'+k).on('value',s=>{parts[k]=s.val();got.add(k);if(k==='notes')noteNotify();build()}));
 setMy(myList().filter(e=>Date.now()-e.ts<6*36e5));myList().forEach(e=>watchOrder(e.id,true));setInterval(()=>{if(R)menu()},60000)}else home();
const sub=()=>R.menu.reduce((a,m)=>a+(!m.out&&cart[m.id]?cart[m.id]*m.price:0),0);
const cnt=()=>R.menu.reduce((a,m)=>a+(!m.out?cart[m.id]||0:0),0);
const STAT=['new','preparing','ready','served'],LBL={new:'Order received',preparing:'Being prepared 👨‍🍳',ready:'Ready! 🎉',served:'Enjoy your meal 😋'};
function menu(){if(!loaded){$('#app').innerHTML='<p class="center mut" style="padding:60px 18px">Loading menu…</p>';return}
 if(!R){$('#app').innerHTML=`<div class="wrap center" style="padding:80px 18px"><h1>Hmm, we can’t find that restaurant</h1><p class="mut">The code “${esc(CODE)}” doesn’t match any restaurant.</p><a href="./"><button class="btn sm">Scan again</button></a></div>`;return}
 const perm=('Notification' in window)?Notification.permission:'unsupported',webOK=perm==='granted',cats=[...new Set(R.menu.map(m=>m.cat||'Menu'))],n=R.notes.filter(x=>Date.now()-x.ts<864e5).slice(-1)[0],mine=Object.values(my).filter(o=>o.status!=='served'||Date.now()-(o.servedAt||o.ts)<6e5).sort((a,b)=>b.id-a.id),c=cnt();
 const y=scrollY;
 $('#app').innerHTML=`<header class="mh"><div class="wrap"><h1>${esc(R.name)}</h1>${TABLE?`<span class="tb">Table ${esc(TABLE)}</span>`:''}</div></header>
 <main class="wrap" style="padding-bottom:110px">
 ${(n&&!webOK)?`<div class="note">📣 ${esc(n.text)}</div>`:''}${perm==='default'?`<button class="note" style="width:100%;border:0;text-align:left;font:inherit;cursor:pointer" onclick="enableNotify()">🔔 Turn on notifications for order updates &amp; offers</button>`:''}
 ${mine.map(o=>{if(o.status==='served')return`<div class="track thanks"><h3>Thanks for dining with us! 💛</h3><p class="mut" style="margin:6px 0 10px">Order #${o.id} is complete. We hope you loved it.</p><button class="btn sm" onclick="dismissLocal(${o.id})">Order something else</button></div>`;const i=STAT.indexOf(o.status);return`<div class="track"><div class="row"><b>Order #${o.id}</b><b style="color:var(--ok)">${LBL[o.status]||o.status}</b></div><div class="mut">${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</div><div class="steps4">${STAT.map((s,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div></div>`}).join('')}
 ${cats.length>1?`<div class="chips">${cats.map((k,i)=>`<button class="chip ${i?'':'on'}" onclick="document.getElementById('c${i}').scrollIntoView({behavior:'smooth'})">${esc(k)}</button>`).join('')}</div>`:''}
 ${cats.map((k,i)=>`<h2 class="sec" id="c${i}">${esc(k)}</h2><div class="grid">${R.menu.filter(m=>(m.cat||'Menu')===k).map(m=>`<div class="item"><div><h3>${esc(m.name)}</h3>${m.desc?`<p>${esc(m.desc)}</p>`:''}<span class="price">${money(m.price)}</span></div>
  ${m.out?'<span class="soldout">Sold out</span>':`<div class="qty">${cart[m.id]?`<button class="m" onclick="cq(${m.id},-1)" aria-label="Remove one">−</button><span>${cart[m.id]}</span>`:''}<button onclick="cq(${m.id},1)" aria-label="Add one">+</button></div>`}</div>`).join('')}</div>`).join('')}
 ${R.menu.length?'':'<p class="mut center" style="padding:40px 0">The menu is being updated. Check back in a moment!</p>'}
 <footer>Powered by <b>Feasibility Media</b></footer></main>
 ${c?`<div class="bar"><div class="in"><div><b>${c} item${c>1?'s':''}</b><div class="price">${money(sub())}</div></div><button class="btn sm" onclick="openSheet()">View order →</button></div></div>`:''}`;scrollTo(0,y)}
function cq(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);promo=null;menu()}

/* ---------- ORDER SHEET ---------- */
function openSheet(){$('#sheet').hidden=false;sheet()}
function closeSheet(){$('#sheet').hidden=true}
function sheet(){if(!R||!cnt()){closeSheet();return}
 const items=R.menu.filter(m=>!m.out&&cart[m.id]),s=sub(),d=promo?s*promo.pct/100:0,keep=[$('#nt')&&$('#nt').value,$('#pc')&&$('#pc').value];
 $('#sb').innerHTML=`<div class="row"><h2>Your order</h2><button class="x" onclick="closeSheet()" aria-label="Close">✕</button></div>
 <div style="margin:14px 0">${items.map(m=>`<div class="row" style="padding:8px 0"><span>${cart[m.id]}× ${esc(m.name)}</span><span class="row"><b>${money(cart[m.id]*m.price)}</b><span class="qty"><button class="m" onclick="cq(${m.id},-1)">−</button><button onclick="cq(${m.id},1)">+</button></span></span></div>`).join('')}</div>
 <hr style="border:0;border-top:1px solid var(--bd)">
 <div class="row"><span>Subtotal</span><span>${money(s)}</span></div>
 ${promo?`<div class="row" style="color:var(--ok)"><span>Promo ${esc(promo.code)} (−${promo.pct}%)</span><span>−${money(d)}</span></div>`:''}
 <div class="row" style="font-size:1.3rem;margin:6px 0 12px"><b>Total</b><b class="price">${money(s-d)}</b></div>
 <div class="row"><input id="pc" placeholder="Promo code" style="margin:0"><button class="btn sm" style="white-space:nowrap" onclick="applyPromo()">Apply</button></div>
 <textarea id="nt" rows="2" placeholder="Anything the kitchen should know? (allergies, no onions…)"></textarea>
 <button class="btn" style="width:100%;margin-top:8px" id="pb" onclick="place()">Place order · ${money(s-d)}</button>`;
 if(keep[0])$('#nt').value=keep[0];if(keep[1])$('#pc').value=keep[1]}
function applyPromo(){const v=$('#pc').value.trim().toUpperCase(),p=R.promos.find(x=>String(x.code).toUpperCase()===v);if(!p){toast('That promo code isn’t valid',true);return}promo=p;sheet();toast('Promo applied 🎉')}
function toast(t,bad){const e=document.createElement('div');e.className='toast';e.textContent=t;if(bad)e.style.background='#b3121b';document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function place(){const items=R.menu.filter(m=>!m.out&&cart[m.id]).map(m=>({n:m.name,q:cart[m.id],p:m.price}));if(!items.length)return;
 const s=items.reduce((a,i)=>a+i.q*i.p,0),d=promo?s*promo.pct/100:0,pc=promo?String(promo.code):'',nt=($('#nt').value||'').trim(),b=$('#pb');b.disabled=true;b.textContent='Sending to kitchen…';if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
 F.ref('restaurants/'+CODE+'/counter').transaction(n=>(n||0)+1,(err,ok,snap)=>{if(err||!ok){toast('Couldn’t place the order. Try again.',true);b.disabled=false;return}const id=snap.val();
  F.ref('restaurants/'+CODE+'/orders/'+id).set({id,table:TABLE,items,sub:s,disc:d,total:s-d,promo:pc,note:nt,status:'new',ts:Date.now()}).then(()=>{
   setMy([...myList(),{id,ts:Date.now()}]);watchOrder(id,false);cart={};promo=null;closeSheet();menu();scrollTo({top:0,behavior:'smooth'});toast('Order #'+id+' sent to the kitchen ✅')
  }).catch(()=>{toast('Order failed. Please try again.',true);b.disabled=false})})}
</script></body></html>

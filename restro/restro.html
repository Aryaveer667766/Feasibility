<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Dashboard — Feasibility Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<style>
:root{--bg:#fff8ee;--card:#fff;--tx:#2b1810;--mut:#7a6558;--bd:#f0e0cc;--ac:#d62828;--ac2:#f77f00;--gold:#fcbf49;--ok:#2a9d5c;
--hf:"Fraunces",Georgia,serif;--bf:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b110c;--card:#261913;--tx:#fbeee0;--mut:#bda591;--bd:#3b2a20}}
:root[data-theme="dark"]{--bg:#1b110c;--card:#261913;--tx:#fbeee0;--mut:#bda591;--bd:#3b2a20}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--bf)}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.15}h2{font-size:1.3rem}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.ok{background:var(--ok)}button.d{background:#b3121b}button.gold{background:var(--gold);color:#2b1810}
button:disabled{opacity:.5}
input,textarea,select{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:5px 0}
label{font-size:.85rem;color:var(--mut);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.row>*{min-width:0}
.mut{color:var(--mut);font-size:.92rem}
.top{background:linear-gradient(150deg,#b3121b,var(--ac) 60%,var(--ac2));color:#fff8ee;padding:16px 0}
.top h1{font-size:1.5rem}.top button.g{color:#fff;border-color:rgba(255,255,255,.5)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;margin:0 -16px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap;border-radius:99px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font:900 1.4rem var(--hf);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.grid .card{margin:0}
.badge{padding:3px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--bd);color:var(--tx)}
.badge.new{background:#b3121b;color:#fff}.badge.preparing{background:var(--gold);color:#2b1810}.badge.ready{background:var(--ok);color:#fff}
.order.new{border:2px solid #b3121b;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(179,18,27,.25)}}
.alarm{background:#b3121b;color:#fff;padding:18px;border-radius:18px;text-align:center;font:900 1.3rem var(--hf);margin:12px 0;animation:fl .6s infinite alternate}
@keyframes fl{to{background:#6e0c12}}
.snd{background:var(--gold);color:#2b1810;padding:12px 16px;border-radius:14px;margin:12px 0;font-weight:700}
.note{background:#fff0cf;color:#4a3a00;border-radius:10px;padding:8px 12px;margin:8px 0}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qrc{text-align:center;padding:16px;border:2px dashed var(--bd);border-radius:18px;background:#fff;color:#000}.qrc div{display:flex;justify-content:center;margin:8px 0}.qrc h3{font-size:1.1rem}.qrc .big{font:900 1.6rem var(--hf);color:#d62828}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.login h1{font-size:2rem;margin-bottom:6px}
@media(max-width:560px){.stats b{font-size:1.1rem}}
@media print{body *{visibility:hidden}#qrs,#qrs *{visibility:visible}#qrs{position:absolute;left:0;top:0;width:100%}.qrc{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){.alarm,.order.new{animation:none}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toFixed(2);
firebase.initializeApp({apiKey:"AIzaSyAZ_c3EaDxSZ6RrNrwQjR_TauJHrPfk_lk",authDomain:"designsnap-f3309.firebaseapp.com",databaseURL:"https://designsnap-f3309-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"designsnap-f3309",storageBucket:"designsnap-f3309.firebasestorage.app",messagingSenderId:"741888249963",appId:"1:741888249963:web:9540c9f68d6f0d5da9a12e"});
const F=firebase.database(),arr=x=>x?Object.values(x).filter(Boolean):[];
let R=null,CODE=null,ref=null,tab='orders',editId=null,audio=null,alarmT=null,maxSeen=-1,first=true,wake=null;
const me=()=>{try{return JSON.parse(sessionStorage.getItem('fm_login'))}catch(e){return null}};
const custUrl=(t)=>new URL('index.html',location.href).href+'?r='+CODE+(t?'&t='+t:'');

/* ---------- login ---------- */
function loginView(msg){$('#app').innerHTML=`<div class="login"><h1>🍽️ Restaurant login</h1><p class="mut">Sign in to manage orders, your menu and QR codes.</p>
 <div class="card"><label>Restaurant code</label><input id="lc" autocapitalize="characters" placeholder="e.g. DEMO"><label>PIN</label><input id="lp" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')login()">
 ${msg?`<p style="color:#b3121b;margin:6px 0">${esc(msg)}</p>`:''}<button style="width:100%;margin-top:8px" onclick="login()">Log in</button></div></div>`}
async function login(){const c=$('#lc').value.trim().toUpperCase(),p=$('#lp').value.trim();if(!c||!p)return;
 initAudio();const s=await F.ref('restaurants/'+c+'/pin').get();
 if(!s.exists()||String(s.val())!==p){loginView('Wrong code or PIN.');return}
 sessionStorage.setItem('fm_login',JSON.stringify({code:c,pin:p}));start(c)}
function logout(){sessionStorage.removeItem('fm_login');stopAlarm();if(ref)ref.off();ref=null;R=null;loginView()}
function initAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}
 try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}

/* ---------- data ---------- */
function start(c){CODE=c;if(ref)ref.off();first=true;maxSeen=-1;
 ref=F.ref('restaurants/'+c);ref.on('value',s=>{const v=s.val();
  if(!v){logout();return}
  const l=me();if(!l||String(v.pin)!==l.pin){logout();return}
  R=v;R.menu=arr(R.menu);R.promos=arr(R.promos);R.notes=arr(R.notes);R.orders=arr(R.orders).sort((a,b)=>a.id-b.id);R.tables=R.tables||1;
  document.documentElement.style.setProperty('--ac',R.color||'#d62828');
  const newest=R.orders.reduce((a,o)=>Math.max(a,o.id),0);
  if(!first&&newest>maxSeen){const o=R.orders[R.orders.length-1];try{if(Notification.permission==='granted')new Notification('🔔 New order #'+o.id,{body:'Table '+(o.table||'—')+' · '+money(o.total)})}catch(e){}}
  maxSeen=newest;first=false;
  if(!$('#tb')||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();else checkAlarm()})}
function saveR(){F.ref('restaurants/'+CODE).update({name:R.name,pin:R.pin,color:R.color||'#d62828',tables:R.tables,menu:R.menu.length?R.menu:null,promos:R.promos.length?R.promos:null,notes:R.notes.length?R.notes:null})}
function render(){if(!R)return;const T=[['orders','Orders'],['menu','Menu'],['promos','Promos'],['notify','Notify'],['qr','QR codes'],['settings','Settings']];
 $('#app').innerHTML=`<div class="top"><div class="wrap row sp"><div><h1>${esc(R.name)}</h1><div style="opacity:.85;font-size:.9rem">Code <b>${esc(CODE)}</b></div></div><div class="row"><a href="${custUrl()}" target="_blank" rel="noopener"><button class="g">View customer menu ↗</button></a><button class="g" onclick="logout()">Log out</button></div></div></div>
 <div class="wrap"><div id="al"></div><div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';editId=null;render()">${t[1]}${t[0]==='orders'&&newCount()?` (${newCount()})`:''}</button>`).join('')}</div><div id="tb"></div></div>`;
 ({orders:tOrders,menu:tMenu,promos:tPromos,notify:tNotify,qr:tQr,settings:tSet})[tab]();checkAlarm()}
const newCount=()=>R.orders.filter(o=>o.status==='new').length;

/* ---------- orders ---------- */
function tOrders(){const act=R.orders.filter(o=>o.status!=='served').reverse(),done=R.orders.filter(o=>o.status==='served').reverse().slice(0,15);
 const day=new Date().setHours(0,0,0,0),td=R.orders.filter(o=>o.ts>=day);
 $('#tb').innerHTML=`<div class="stats"><div class="stat"><b>${td.length}</b><span class="mut">Orders today</span></div><div class="stat"><b>${money(td.reduce((a,o)=>a+o.total,0))}</b><span class="mut">Sales today</span></div><div class="stat"><b>${money(R.orders.reduce((a,o)=>a+o.total,0))}</b><span class="mut">All-time sales</span></div></div>
 <h2>Active orders</h2><div class="grid" style="margin-top:10px">${act.map(o=>`<div class="card order ${o.status}"><div class="row sp"><h3>#${o.id} · Table ${esc(o.table||'—')}</h3><span class="badge ${o.status}">${o.status}</span></div>
 <div class="mut">${new Date(o.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
 <div style="margin:8px 0">${o.items.map(i=>`<div><b>${i.q}×</b> ${esc(i.n)}</div>`).join('')}</div>${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}
 <div class="row sp"><b>${money(o.total)}</b>${o.promo?`<span class="mut">promo ${esc(o.promo)}</span>`:''}</div>
 <button class="${o.status==='new'?'':'ok'}" style="width:100%;margin-top:10px;padding:14px" onclick="adv(${o.id})">${o.status==='new'?'✅ Accept order':o.status==='preparing'?'Mark ready':'Mark served'}</button></div>`).join('')||'<p class="mut">No active orders. New ones will appear here with an alarm.</p>'}</div>
 ${done.length?`<h2 style="margin-top:24px">Recently served</h2>${done.map(o=>`<div class="card row sp"><span>#${o.id} · Table ${esc(o.table||'—')} · ${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</span><b>${money(o.total)}</b></div>`).join('')}`:''}`}
function adv(id){initAudio();const o=R.orders.find(x=>x.id===id);F.ref('restaurants/'+CODE+'/orders/'+id+'/status').set({new:'preparing',preparing:'ready',ready:'served'}[o.status])}

/* ---------- menu ---------- */
function tMenu(){const e=R.menu.find(m=>m.id===editId)||{};
 $('#tb').innerHTML=`<div class="card"><h2>${editId?'Edit item':'Add menu item'}</h2><label>Name</label><input id="mn" value="${esc(e.name)}" placeholder="e.g. Margherita Pizza">
 <div class="row"><div style="flex:1"><label>Price</label><input id="mp" type="number" step="0.01" min="0" value="${e.price??''}"></div><div style="flex:1"><label>Category</label><input id="mc" value="${esc(e.cat)}" placeholder="Mains, Drinks…" list="cl"></div></div>
 <datalist id="cl">${[...new Set(R.menu.map(m=>m.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <label>Description</label><input id="md" value="${esc(e.desc)}" placeholder="Short and tasty"><div class="row" style="margin-top:8px"><button onclick="saveItem()">${editId?'Save changes':'Add to menu'}</button>${editId?'<button class="g" onclick="editId=null;render()">Cancel</button>':''}</div></div>
 <div class="grid">${R.menu.map(m=>`<div class="card"><div class="row sp"><div><b>${esc(m.name)}</b> ${m.out?'<span class="badge">sold out</span>':''}<div class="mut">${esc(m.cat)} · ${money(m.price)}</div></div></div>
 <div class="row" style="margin-top:10px"><button class="g" onclick="editId=${m.id};render();scrollTo(0,0)">Edit</button><button class="g" onclick="toggleOut(${m.id})">${m.out?'Restock':'Sold out'}</button><button class="d" onclick="delItem(${m.id})">Delete</button></div></div>`).join('')}</div>${R.menu.length?'':'<p class="mut">No items yet. Add your first dish above.</p>'}`}
function saveItem(){const n=$('#mn').value.trim(),p=parseFloat($('#mp').value);if(!n||isNaN(p)||p<0){alert('Please enter a name and a valid price.');return}
 const d={name:n,price:p,cat:$('#mc').value.trim()||'Menu',desc:$('#md').value.trim()};
 if(editId){Object.assign(R.menu.find(m=>m.id===editId),d);editId=null}else R.menu.push({id:Date.now(),...d});saveR()}
function toggleOut(id){const m=R.menu.find(x=>x.id===id);m.out=!m.out;saveR()}
function delItem(id){if(confirm('Delete this item?')){R.menu=R.menu.filter(m=>m.id!==id);saveR()}}

/* ---------- promos / notify ---------- */
function tPromos(){$('#tb').innerHTML=`<div class="card"><h2>New promo code</h2><div class="row"><div style="flex:1"><label>Code</label><input id="pcd" placeholder="SAVE20" autocapitalize="characters"></div><div style="flex:1"><label>% off</label><input id="ppc" type="number" min="1" max="100"></div></div><button onclick="addPromo()" style="margin-top:8px">Add promo</button></div>
 ${R.promos.map(p=>`<div class="card row sp"><span><b>${esc(p.code)}</b> — ${p.pct}% off</span><button class="d" onclick="delPromo('${esc(p.code)}')">Delete</button></div>`).join('')||'<p class="mut">No promo codes yet.</p>'}`}
function addPromo(){const c=$('#pcd').value.trim().toUpperCase().replace(/\s/g,''),p=parseFloat($('#ppc').value);if(!c||!(p>0&&p<=100)){alert('Enter a code and a percentage between 1 and 100.');return}
 R.promos=R.promos.filter(x=>x.code!==c);R.promos.push({code:c,pct:p});saveR()}
function delPromo(c){R.promos=R.promos.filter(p=>p.code!==c);saveR()}
function tNotify(){$('#tb').innerHTML=`<div class="card"><h2>Send a notification</h2><p class="mut">Shows as a banner on every customer’s menu for 24 hours.</p><textarea id="nm" rows="3" maxlength="200" placeholder="e.g. 2-for-1 desserts until 9pm! 🍰"></textarea><button onclick="sendNote()">📣 Send to customers</button></div>
 ${R.notes.slice().reverse().slice(0,10).map(n=>`<div class="card mut">${new Date(n.ts).toLocaleString()}<br><span style="color:var(--tx)">${esc(n.text)}</span></div>`).join('')}`}
function sendNote(){const t=$('#nm').value.trim();if(!t)return;R.notes.push({ts:Date.now(),text:t});R.notes=R.notes.slice(-30);saveR()}

/* ---------- QR ---------- */
function tQr(){$('#tb').innerHTML=`<div class="row sp"><p class="mut" style="margin:0">One QR per table — customers scan and order straight from their seat.</p><button onclick="print()">🖨 Print all</button></div><div id="qrs" class="qrs" style="margin-top:12px"></div>`;
 for(let t=1;t<=R.tables;t++){const d=document.createElement('div');d.className='qrc';d.innerHTML=`<h3>${esc(R.name)}</h3><div></div><div class="big">Table ${t}</div><div style="font-size:.85rem">Scan to see the menu &amp; order</div>`;$('#qrs').appendChild(d);
  try{new QRCode(d.children[1],{text:custUrl(t),width:170,height:170,correctLevel:QRCode.CorrectLevel.M})}catch(e){d.children[1].textContent='QR unavailable'}}}

/* ---------- settings ---------- */
function tSet(){$('#tb').innerHTML=`<div class="card"><h2>Restaurant settings</h2><label>Restaurant name</label><input id="sn" value="${esc(R.name)}">
 <div class="row"><div style="flex:1"><label>Brand colour</label><input id="sc" type="color" value="${esc(R.color||'#d62828')}" style="height:48px;padding:4px"></div><div style="flex:1"><label>Number of tables</label><input id="st" type="number" min="1" max="200" value="${R.tables}"></div></div>
 <label>Login PIN</label><input id="sp" value="${esc(R.pin)}"><button style="margin-top:8px" onclick="saveSet()">Save settings</button></div>
 <div class="card"><h2>Alert sound</h2><p class="mut">Test the new-order alarm so you know it’s loud enough.</p><button class="gold" onclick="initAudio();beep()">🔊 Test alarm</button></div>`}
function saveSet(){const pin=$('#sp').value.trim();if(!pin){alert('PIN is required');return}
 R.name=$('#sn').value.trim()||R.name;R.color=$('#sc').value;R.tables=Math.max(1,Math.min(200,parseInt($('#st').value)||1));R.pin=pin;
 sessionStorage.setItem('fm_login',JSON.stringify({code:CODE,pin}));saveR()}

/* ---------- LOUD ALARM ---------- */
function beep(){if(!audio)return;try{audio.resume();[880,660,880,660].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.9;o.connect(g);g.connect(audio.destination);const s=audio.currentTime+i*.22;o.start(s);o.stop(s+.18)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch(e){}}
function checkAlarm(){const n=R?newCount():0,al=$('#al');if(!al)return;
 const muted=n&&(!audio||audio.state!=='running');
 al.innerHTML=(n?`<div class="alarm">🔔 ${n} NEW ORDER${n>1?'S':''} — ACCEPT NOW</div>`:'')+(muted?`<div class="snd">🔇 Sound is off. <button class="gold" onclick="initAudio();checkAlarm()">Tap to enable the alarm</button></div>`:'');
 if(n&&!alarmT){beep();alarmT=setInterval(()=>{if(R&&newCount()){beep();document.title=document.title.startsWith('🔔')?'🚨 NEW ORDER!':'🔔 NEW ORDER!'}else stopAlarm()},1600);document.title='🔔 NEW ORDER!'}
 if(!n)stopAlarm()}
function stopAlarm(){if(alarmT){clearInterval(alarmT);alarmT=null}document.title='Restaurant Dashboard — Feasibility Menu'}
addEventListener('click',()=>{if(!audio)initAudio()},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me()&&(!wake||wake.released))try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}});

/* ---------- boot ---------- */
const l=me();if(l)start(l.code);else loginView();
</script></body></html>

 <div class="prog" style="margin-bottom:14px"><div style="width:${pct}%"></div></div>

 <h3 style="margin:14px 0 6px">Activity console</h3><div class="console" id="con">${wbLog.map(l=>`<div>${E(l)}</div>`).join('')}</div></div>
 <div><div class="card"><div class="gap" style="margin-bottom:12px">${['Content','Design','SEO','Contact','Social','Settings'].map(t=>`<button class="ghost ${t===wbTab?'on2':''}" data-a="wbtab" data-v="${t}">${t}</button>`).join('')}</div>
 ${wbTab==='Settings'?`<h3>Website sections</h3>${SEC.map(x=>`<label class="chk"><input type="checkbox" data-sec="${x}" ${W.sections[x]!==false?'checked':''}>${x}</label>`).join('')}<label>Project progress override %<input type="number" data-prog value="${W.progress??pct}"></label>`:TAB.map(([k,l,t,o])=>`<label style="margin-bottom:10px">${l}${t==='a'?`<textarea data-s="${k}">${E(s[k])}</textarea>`:t==='sel'?`<select data-s="${k}">${o.map(x=>`<option ${s[k]===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input data-s="${k}" type="${t||'text'}" value="${E(s[k]||(t==='color'?'#E11D48':''))}">`}</label>`).join('')}</div>
 <div class="card" style="margin-top:12px"><h3>Build checklist · ${done}/${tot}</h3>${Object.entries(CH).map(([g,items])=>`<b>${g}</b>${items.map(i=>`<label class="chk"><input type="checkbox" data-chk="${g}|${i}" ${W.checks[g+'|'+i]?'checked':''}>${i}</label>`).join('')}`).join('')}</div></div></div>`;
}
function loadW(p){const c=D.clients.find(x=>x.id===p.clientId)||{};W={id:p.id,site:{name:c.name||p.name,tagline:'Welcome',c1:'#E11D48',c2:'#111111',font:'Inter,sans-serif',btn:'rounded',card:'shadow',phone:c.phone||'',whatsapp:c.whatsapp||'',email:c.email||'',instagram:c.instagram||'',address:c.city||'',...(p.site||{})},checks:{...(p.checks||{})},sections:{...(p.sections||{})},progress:p.progress};wbLog=[];wl('Loading client configuration...');wl('Initializing website project...')}
function wl(t){wbLog.push(new Date().toLocaleTimeString()+'  '+t);if(wbLog.length>60)wbLog.shift();const c=$('#con');if(c){c.innerHTML=wbLog.map(l=>`<div>${E(l)}</div>`).join('');c.scrollTop=1e9}}
function pv(){
 const s=W.site,sec=x=>W.sections[x]!==false,r={rounded:'8px',pill:'30px',square:'0'}[s.btn],cd={shadow:'box-shadow:0 2px 10px #0002',border:'border:1px solid #ddd',flat:'background:#f4f4f5'}[s.card];
 const sv=(s.services||'').split('\n').filter(Boolean),ph=D.media.filter(m=>m.projectId===W.id&&m.type==='Photo'&&m.url).slice(0,6);
 const b=(t,h)=>`<a class="btnx" style="background:${s.c1};border-radius:${r}" href="${E(h||'#')}">${t}</a>`;
 $('#pv').innerHTML=`<div style="font-family:${s.font}">${sec('Hero')?`<section style="background:${s.c2};color:#fff;text-align:center"><h1>${E(s.name)}</h1><p>${E(s.tagline)}</p><p style="opacity:.7">${E(s.desc)}</p>${b('Get in touch')}</section>`:''}
 ${sec('About')&&s.about?`<section><h2>About</h2><p>${E(s.about)}</p></section>`:''}
 ${sec('Services')&&sv.length?`<section><h2>Services</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${sv.map(x=>`<div style="padding:14px;border-radius:10px;${cd}">${E(x)}</div>`).join('')}</div></section>`:''}
 ${sec('Gallery')?`<section><h2>Gallery</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${(ph.length?ph.map(m=>`<img src="${E(m.url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">`):[1,2,3].map(()=>'<div style="aspect-ratio:1;background:#e5e5e8;border-radius:8px"></div>')).join('')}</div></section>`:''}
 ${sec('Testimonials')&&s.testi?`<section style="background:#f4f4f5"><h2>Testimonials</h2>${s.testi.split('\n').filter(Boolean).map(x=>`<p>“${E(x)}”</p>`).join('')}</section>`:''}
 ${sec('Location')&&s.address?`<section><h2>Location</h2><p>${E(s.address)}</p>${s.maps?b('Open in Maps',s.maps):''}</section>`:''}
 ${sec('Contact')?`<section><h2>Contact</h2><p>${E(s.phone)} ${E(s.email)}</p><p>${[s.instagram&&'Instagram',s.facebook&&'Facebook',s.youtube&&'YouTube'].filter(Boolean).join(' · ')}</p></section>`:''}
 ${sec('WhatsApp CTA')&&s.whatsapp?`<div style="position:sticky;bottom:10px;text-align:right;padding:10px"><a class="btnx" style="background:#25D366;border-radius:30px" href="https://wa.me/${E(s.whatsapp.replace(/\D/g,''))}">WhatsApp us</a></div>`:''}</div>`;
}
function present(){
 const p=D.projects.find(x=>x.id===W.id),all=Object.entries(CH),tot=Object.values(CH).flat().length,dn=Object.keys(W.checks).filter(k=>W.checks[k]),pct=Math.round(dn.length/tot*100);
 const todo=Object.values(CH).flat().length-dn.length;
 $('#modal').innerHTML=`<div class="overlay" style="background:#0b0b0d" data-a="close"><div class="modal" data-stop style="width:min(900px,100%);text-align:center"><h1 style="font-size:36px">${E(lbl('clients',p.clientId))}</h1><p class="muted">${E(p.name)}</p><div style="font-size:84px;font-weight:700;color:#E11D48">${pct}%</div><div class="prog"><div style="width:${pct}%"></div></div><p class="muted">Estimated completion: ${E(p.due||'to be confirmed')} · ${todo} steps remaining</p><div style="text-align:left;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${all.map(([g,items])=>`<div><b>${g}</b>${items.map(i=>`<div class="${W.checks[g+'|'+i]?'':'muted'}">${W.checks[g+'|'+i]?'✓':'○'} ${i}</div>`).join('')}</div>`).join('')}</div><div class="gap end"><button class="btn" data-a="close">Close</button></div></div></div>`;
}

// Data tools
const csv=c=>{const F=S[c][1];const t=[F.map(f=>f[1]),...D[c].map(r=>F.map(f=>f[2]==='r'?lbl(f[3],r[f[0]]):r[f[0]]??''))].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');dl(c+'.csv',t,'text/csv')};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const strip=r=>{const{id,createdAt,...x}=r;return x};
async function demo(){
 if(D.clients.some(c=>c.demo)&&!confirm('Demo data already loaded. Load again?'))return;
 const mk=async(c,d)=>(await addDoc(collection(db,c),{...d,demo:true,archived:false,createdAt:serverTimestamp()})).id;
 const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
 try{for(const [i,[n,cat,st,paidAmt]] of [['ABC Salon','Salon','Photography',1500],['Urban Brew Café','Café','Development',3000],['Forge Athletics','Fitness','Design',1000],['Nova Fashion','Fashion','Planning',0]].entries()){
  const cid=await mk('clients',{name:n,category:cat,status:'Active Client',owner:OWN[i%2],city:'Jamshedpur',phone:'',notes:''});
  const pid=await mk('projects',{name:n+' Website',clientId:cid,value:3000,status:st,progress:20+i*20,priority:'Medium',due:day(-14)});
  if(paidAmt)await mk('payments',{clientId:cid,projectId:pid,amount:paidAmt,method:'UPI',status:'Paid',date:day(i*10)});
  await mk('expenses',{category:'Photography',amount:300+i*100,date:day(i*8),projectId:pid,description:'Shoot',by:me.name});
  await mk('leads',{name:n+' (lead)',owner:OWN[i%2],status:['Won','Interested','Demo Sent','New'][i],value:3000,source:'Instagram'});
  await mk('tasks',{name:'Collect content for '+n,projectId:pid,status:'Todo',priority:'High'})}
  await log('Demo data loaded');toast('Demo data loaded.')}catch{toast('Unable to load demo data.')}
}
async function clearDemo(){if(!confirm('Archive all demo records?'))return;let n=0;for(const c of Object.keys(S))for(const r of D[c].filter(r=>r.demo)){await upd(c,r.id,{archived:true});n++}toast(`Archived ${n} demo records.`)}

// Global search
function gsearch(){
 $('#modal').innerHTML=`<div class="overlay" data-a="close" style="align-items:start"><div class="modal" data-stop style="margin-top:8vh"><input id="gs" placeholder="Search clients, leads, projects, tasks, payments, expenses…" autofocus><div id="gr" style="margin-top:10px"></div></div></div>`;
 $('#gs').focus();$('#gs').oninput=e=>{const v=e.target.value.toLowerCase();$('#gr').innerHTML=v?['clients','leads','projects','tasks','payments','expenses'].flatMap(c=>D[c].filter(r=>JSON.stringify(r).toLowerCase().includes(v)).slice(0,5).map(r=>`<div class="row" style="cursor:pointer" data-a="go" data-v="${c}"><span>${E(r.name||lbl('clients',r.clientId)||r.category)}</span><span class="muted">${S[c][0]}</span></div>`)).join('')||'<span class="muted">No results.</span>':''};
}

// Events
document.addEventListener('click',async e=>{
 const so0=e.target.closest('[data-sort]');if(so0){const k=so0.dataset.sort;sort[page]=sort[page]?.k===k?{k,d:-sort[page].d}:{k,d:1};render();return}
 const t=e.target.closest('[data-a]');if(!t)return;
 if(e.target.closest('[data-stop]')&&t.dataset.a==='close'&&t===t.closest('.overlay')&&!e.target.closest('button')&&e.target.closest('.modal'))return;
 const a=t.dataset.a,v=t.dataset.v,c=page;
 if(a==='nav'){page=v;open=false;render()}
 else if(a==='menu'){open=!open;render()}
 else if(a==='meet'){meet=!meet;if(meet&&MEETHIDE.includes(page))page='dashboard';render()}
 else if(a==='search')gsearch();
 else if(a==='mine'){mine=!mine;render()}
 else if(a==='out'){await signOut(auth);location.reload()}
 else if(a==='mode'){authMode=authMode==='up'?'in':'up';aerr='';render()}
 else if(a==='auth')doAuth();
 else if(a==='rg'){rg=v;render()}
 else if(a==='rd'){read[v]=1;saveRead();render()}
 else if(a==='rdall'){notes().forEach(x=>read[x.id]=1);saveRead();render()}
 else if(a==='cal'){calM=new Date(calM.getFullYear(),calM.getMonth()+ +v,1);render()}
 else if(a==='profile')profile(v);
 else if(a==='wbopen'){loadW(D.projects.find(x=>x.id===v));page='workbench';$('#modal').innerHTML='';render()}
 else if(a==='go'){$('#modal').innerHTML='';page=v;render()}
 else if(a==='add')form(v||c);
 else if(a==='edit')form(c,D[c].find(r=>r.id===v));
 else if(a==='arch'){if(confirm('Archive this record? It is hidden but kept in the database.'))try{await arch(c,D[c].find(r=>r.id===v));toast('Archived.')}catch{toast('Unable to archive.')}}
 else if(a==='view'){view[v]=view[v]==='k'?'t':'k';render()}
 else if(a==='save')save(t.dataset.c,v||'');
 else if(a==='close'&&(t.classList.contains('overlay')?e.target===t:true))$('#modal').innerHTML='';
 else if(a==='csv')csv(v);
 else if(a==='json')dl(v+'.json',JSON.stringify(D[v].map(strip),null,2),'application/json');
 else if(a==='exportall')dl('feasibility-export.json',JSON.stringify(Object.fromEntries(Object.keys(S).map(k=>[k,D[k].map(strip)])),null,2),'application/json');
 else if(a==='demo')demo();else if(a==='cleardemo')clearDemo();
 else if(a==='wbtab'){wbTab=v;render()}
 else if(a==='present')present();
 else if(a==='wbsave'){const tot=Object.values(CH).flat().length,pct=W.progress??Math.round(Object.values(W.checks).filter(Boolean).length/tot*100);wl('Saving configuration...');try{await upd('projects',W.id,{site:W.site,checks:W.checks,sections:W.sections,progress:pct});await log('Website updated: '+lbl('projects',W.id));wl('Website configuration saved.');toast('Website saved.')}catch{wl('Save failed.');toast('Unable to save changes.')}}
});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.rd){const[c,k]=t.dataset.rd.split(':');(rd[c]=rd[c]||{})[k]=t.value;render()}
 if(t.id==='up'&&t.files[0]){const f=t.files[0];toast('Uploading…');try{const r=ref(st,'media/'+Date.now()+'-'+f.name);await uploadBytes(r,f);$('[data-k="url"]').value=await getDownloadURL(r);if(!$('[data-k="name"]').value)$('[data-k="name"]').value=f.name;toast('Uploaded.')}catch{toast('Upload failed. Check Storage rules.')}}
 if(t.dataset.a==='wbsel'){loadW(D.projects.find(p=>p.id===t.value));render()}
 if(t.dataset.f){fl[t.dataset.f]=t.value;render()}
 if(t.dataset.chk){W.checks[t.dataset.chk]=t.checked;W.progress=undefined;wl((t.checked?'Completed: ':'Reopened: ')+t.dataset.chk.split('|')[1]);render()}
 if(t.dataset.sec){W.sections[t.dataset.sec]=t.checked;wl((t.checked?'Enabled ':'Disabled ')+t.dataset.sec+' section...');pv()}
 if(t.id==='imp'){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);let n=0;for(const c of Object.keys(S))for(const x of j[c]||[]){await addDoc(collection(db,c),{...x,archived:false,createdAt:serverTimestamp()});n++}toast(`Imported ${n} records.`)}catch{toast('Invalid import file.')}};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.q){q[t.dataset.q]=t.value;const p=t.selectionStart;render();const n=$(`[data-q="${t.dataset.q}"]`);n.focus();n.setSelectionRange(p,p)}
 if(t.dataset.s){W.site[t.dataset.s]=t.value;pv();clearTimeout(window.wt);window.wt=setTimeout(()=>wl('Website preview updated.'),600)}
 if(t.dataset.prog!==undefined)W.progress=+t.value;
});
document.addEventListener('dragstart',e=>{const d=e.target.closest?.('[data-drag]');if(d)e.dataTransfer.setData('id',d.dataset.drag)});
document.addEventListener('dragover',e=>{if(e.target.closest?.('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',async e=>{const c=e.target.closest?.('[data-drop]');if(!c)return;const id=e.dataTransfer.getData('id');if(!id)return;try{await upd(page,id,{status:c.dataset.drop});await log(`${S[page][0].replace(/s$/,'')} moved to ${c.dataset.drop}: ${D[page].find(r=>r.id===id)?.name}`);toast('Moved to '+c.dataset.drop)}catch{toast('Unable to save changes.')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(me)gsearch()}if(e.key==='Escape')$('#modal').innerHTML='';if(e.key==='Enter'&&e.target.id?.startsWith('au_'))doAuth()});
function loginView(){const up=authMode==='up';return `<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#2a0a14,#0b0b0d 55%)"><div class="card" style="width:min(420px,100%);padding:30px"><div class="logo" style="padding:0 0 16px"><b>F</b> Feasibility Media</div><h1>${up?'Create your account':'Welcome back'}</h1><p class="muted">${up?'First time here? Tell us who you are.':'Sign in to your workspace.'}</p>${aerr?`<div class="err" style="border-radius:10px;margin:10px 0">${E(aerr)}</div>`:''}
<div class="form" style="grid-template-columns:1fr;margin-top:14px">${up?`<label>Your name<input id="au_nm" value="${E(aform.nm||'')}" placeholder="e.g. Aryaveer"></label>`:''}<label>Email<input id="au_em" type="email" value="${E(aform.em||'')}"></label><label>Password<input id="au_pw" type="password" placeholder="min. 6 characters"></label></div>
<button class="btn" style="width:100%;margin-top:16px" data-a="auth">${up?'Create account':'Sign in'}</button><p class="muted" style="text-align:center">${up?'Already have an account?':'New to the team?'} <a data-a="mode" style="color:#fda4af;cursor:pointer">${up?'Sign in':'Create account'}</a></p></div></div>`}
async function doAuth(){const em=($('#au_em')?.value||'').trim(),pw=$('#au_pw')?.value||'',nm=($('#au_nm')?.value||'').trim();aform={em,nm};aerr='';
 if(!em||!pw||(authMode==='up'&&!nm)){aerr='Please fill in all fields.';render();return}
 try{if(authMode==='up'){signingUp=true;const c=await createUserWithEmailAndPassword(auth,em,pw),p={name:nm,email:em};await setDoc(doc(db,'users',c.user.uid),{...p,createdAt:serverTimestamp()});me={uid:c.user.uid,...p};signingUp=false;await log('Joined the workspace');start()}else await signInWithEmailAndPassword(auth,em,pw);
  try{localStorage.setItem('fm_acct','1')}catch{}render()}
 catch(e){signingUp=false;aerr={'auth/email-already-in-use':'An account with this email exists. Please sign in.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Enter a valid email.','auth/operation-not-allowed':'Enable Email/Password sign-in in Firebase Console → Authentication.'}[e.code]||('Sign-in failed: '+e.code);render()}}
try{if(localStorage.getItem('fm_acct'))authMode='in'}catch{}
onAuthStateChanged(auth,async u=>{if(signingUp){authReady=true;return}stage='Verifying account…';sp=35;if(!u){authReady=true;me=null;render();return}
 if(!me){stage='Loading your profile…';sp=55;authReady=false;render();try{const r=doc(db,'users',u.uid),g=await getDoc(r);if(g.exists())me={uid:u.uid,...g.data()};else{const p={name:(u.email||'User').split('@')[0],email:u.email};await setDoc(r,{...p,createdAt:serverTimestamp()});me={uid:u.uid,...p}}}catch(e){aerr='Could not load your profile: '+e.code;}}
 authReady=true;if(me)start();render()});
render();
</script></body></html>

 if(t.dataset.chk){W.checks[t.dataset.chk]=t.checked;W.progress=undefined;wl((t.checked?'Completed: ':'Reopened: ')+t.dataset.chk.split('|')[1]);render()}
 if(t.dataset.sec){W.sections[t.dataset.sec]=t.checked;wl((t.checked?'Enabled ':'Disabled ')+t.dataset.sec+' section...');pv()}
 if(t.id==='imp'){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);let n=0;for(const c of Object.keys(S))for(const x of j[c]||[]){await addDoc(collection(db,c),{...x,archived:false,createdAt:serverTimestamp()});n++}toast(`Imported ${n} records.`)}catch{toast('Invalid import file.')}};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.closest?.('#inv'))itot();
 if(t.dataset.q){q[t.dataset.q]=t.value;pg[t.dataset.q]=0;const p=t.selectionStart;render();const n=$(`[data-q="${t.dataset.q}"]`);n.focus();n.setSelectionRange(p,p)}
 if(t.dataset.s){W.site[t.dataset.s]=t.value;pv();clearTimeout(window.wt);window.wt=setTimeout(()=>wl('Website preview updated.'),600)}
 if(t.dataset.prog!==undefined)W.progress=+t.value;
});
document.addEventListener('dragstart',e=>{const d=e.target.closest?.('[data-drag]');if(d)e.dataTransfer.setData('id',d.dataset.drag)});
document.addEventListener('dragover',e=>{if(e.target.closest?.('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',async e=>{const c=e.target.closest?.('[data-drop]');if(!c)return;const id=e.dataTransfer.getData('id');if(!id)return;try{await upd(page,id,{status:c.dataset.drop});await log(`${S[page][0].replace(/s$/,'')} moved to ${c.dataset.drop}: ${D[page].find(r=>r.id===id)?.name}`);toast('Moved to '+c.dataset.drop)}catch{toast('Unable to save changes.')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(me)gsearch()}if(e.key==='Escape')$('#modal').innerHTML='';if(e.key==='Enter'&&e.target.id?.startsWith('au_'))doAuth()});
function loginView(){const up=authMode==='up';return `<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#2a0a14,#0b0b0d 55%)"><div class="card" style="width:min(420px,100%);padding:30px"><div class="logo" style="padding:0 0 16px"><b>F</b> Feasibility Media</div><h1>${up?'Create your account':'Welcome back'}</h1><p class="muted">${up?'First time here? Tell us who you are.':'Sign in to your workspace.'}</p>${aerr?`<div class="err" style="border-radius:10px;margin:10px 0">${E(aerr)}</div>`:''}
<div class="form" style="grid-template-columns:1fr;margin-top:14px">${up?`<label>Your name<input id="au_nm" value="${E(aform.nm||'')}" placeholder="e.g. Aryaveer"></label>`:''}<label>Email<input id="au_em" type="email" value="${E(aform.em||'')}"></label><label>Password<input id="au_pw" type="password" placeholder="min. 6 characters"></label></div>
<button class="btn" style="width:100%;margin-top:16px" data-a="auth">${up?'Create account':'Sign in'}</button><p class="muted" style="text-align:center">${up?'Already have an account?':'New to the team?'} <a data-a="mode" style="color:#fda4af;cursor:pointer">${up?'Sign in':'Create account'}</a></p></div></div>`}
async function doAuth(){const em=($('#au_em')?.value||'').trim(),pw=$('#au_pw')?.value||'',nm=($('#au_nm')?.value||'').trim();aform={em,nm};aerr='';
 if(!em||!pw||(authMode==='up'&&!nm)){aerr='Please fill in all fields.';render();return}
 try{if(authMode==='up'){signingUp=true;const c=await createUserWithEmailAndPassword(auth,em,pw),p={name:nm,email:em};await setDoc(doc(db,'users',c.user.uid),{...p,createdAt:serverTimestamp()});me={uid:c.user.uid,...p};signingUp=false;await log('Joined the workspace');start()}else await signInWithEmailAndPassword(auth,em,pw);
  try{localStorage.setItem('fm_acct','1')}catch{}render()}
 catch(e){signingUp=false;aerr={'auth/email-already-in-use':'An account with this email exists. Please sign in.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Enter a valid email.','auth/operation-not-allowed':'Enable Email/Password sign-in in Firebase Console → Authentication.'}[e.code]||('Sign-in failed: '+e.code);render()}}
try{if(localStorage.getItem('fm_acct'))authMode='in'}catch{}
onAuthStateChanged(auth,async u=>{if(signingUp){authReady=true;return}stage='Verifying account…';sp=35;if(!u){authReady=true;me=null;render();return}
 if(!me){stage='Loading your profile…';sp=55;authReady=false;render();try{const r=doc(db,'users',u.uid),g=await getDoc(r);if(g.exists()&&g.data().disabled){aerr='Your access has been removed. Please contact an admin.';await signOut(auth)}else if(g.exists())me={uid:u.uid,...g.data()};else{const p={name:(u.email||'User').split('@')[0],email:u.email};await setDoc(r,{...p,createdAt:serverTimestamp()});me={uid:u.uid,...p}}}catch(e){aerr='Could not load your profile: '+e.code;}}
 authReady=true;if(me)start();render()});
render();
</script></body></html>
